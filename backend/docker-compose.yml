# BALAFON + GUIDE — PostgreSQL + Redis en local
#   docker compose up -d
#   docker ps  → balafon_guide_db + balafon_guide_redis
#
# NB : les identifiants sont alignés sur backend/.env (et sur les valeurs par
# défaut de settings.py) : base balafon_tv, utilisateur postgres.
services:
  db:
    image: postgres:16-alpine
    container_name: balafon_guide_db
    environment:
      POSTGRES_DB: ${DB_NAME:-balafon_tv}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-balafon_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-balafon_tv}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: balafon_guide_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
