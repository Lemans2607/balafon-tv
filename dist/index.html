<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Balafon + Guide — le portail TV et le studio de gestion d'antenne de Balafon Media Group : grille EPG, validation éditoriale et régie synchronisée vMix."
    />
    <meta name="theme-color" content="#0B0E14" />
    <title>Balafon + Guide — Balafon TV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      CORRECTIF : ce fichier n'existait pas à la racine du projet livré
      (seul dist/index.html — un ARTEFACT DE BUILD déjà compilé — était
      présent). Sans lui, `npm run dev` comme `npm run build` échouent
      immédiatement : Vite cherche son point d'entrée HTML à la racine
      et n'a rien à servir. Voir MODIFICATIONS.md.

      Rideau d'ouverture : peint ici, en CSS pur, avant même l'évaluation
      des modules JS — l'écran n'est donc jamais noir, y compris sur une
      connexion lente. Il se retire dès que React a peint son premier
      rendu, avec un plancher de 1,1 s pour laisser l'animation se jouer,
      puis se démonte pour ne rien laisser dans le DOM.
    -->
    <style>
      #rideau {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 520px at 50% 40%, #11151f, #05060a 72%);
        font-family: "Poppins", system-ui, sans-serif;
      }
      #rideau .lames {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        height: 96px;
      }
      #rideau .lames i {
        width: 15px;
        border-radius: 7px;
        transform-origin: 50% 100%;
        animation: frappe 0.62s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }
      @keyframes frappe {
        0% {
          transform: scaleY(0.18) translateY(16px);
          opacity: 0;
        }
        55% {
          transform: scaleY(1.1) translateY(-5px);
          opacity: 1;
        }
        100% {
          transform: scaleY(1) translateY(0);
          opacity: 1;
        }
      }
      #rideau p {
        margin: 22px 0 0;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: -0.02em;
        color: #f7f8fa;
        text-align: center;
      }
      #rideau small {
        display: block;
        margin-top: 5px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 400;
        font-size: 10.5px;
        letter-spacing: 0.22em;
        color: #6d7688;
      }
      body.pret #rideau {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.45s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        #rideau .lames i {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-npzqfy_Y.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-SpoXqs5b.css">
  </head>
  <body>
    <div id="rideau" role="status" aria-label="Ouverture de l'antenne">
      <div>
        <div class="lames" aria-hidden="true">
          <i style="height: 46px; background: #e31e24; animation-delay: 0s"></i>
          <i style="height: 68px; background: #e31e24; animation-delay: 0.09s"></i>
          <i style="height: 92px; background: #ffb800; animation-delay: 0.18s"></i>
          <i style="height: 70px; background: #ffb800; animation-delay: 0.27s"></i>
          <i style="height: 50px; background: #0f6bd6; animation-delay: 0.36s"></i>
        </div>
        <p>Balafon + Guide<small>OUVERTURE D'ANTENNE</small></p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      /* Le rideau se lève dès que React a peint, avec un plancher de
         1,1 s pour laisser l'animation se jouer en entier. */
      (function () {
        var depart = Date.now();
        var leve = false;
        var lever = function () {
          if (leve) return;
          leve = true;
          var reste = Math.max(0, 1100 - (Date.now() - depart));
          setTimeout(function () {
            document.body.classList.add("pret");
            setTimeout(function () {
              var r = document.getElementById("rideau");
              if (r && r.parentNode) r.parentNode.removeChild(r);
            }, 500);
          }, reste);
        };
        var racine = document.getElementById("root");
        var obs = new MutationObserver(function () {
          if (racine.childElementCount > 0) {
            obs.disconnect();
            lever();
          }
        });
        obs.observe(racine, { childList: true });
        setTimeout(lever, 8000); // filet de sécurité si le montage échoue
      })();
    </script>

  </body>
</html>
